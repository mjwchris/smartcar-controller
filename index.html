<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HM-10 음성 제어 스마트카</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #00e676;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
        }

        #status {
            font-size: 20px;
            font-weight: 600;
            color: #29b6f6;
            margin: 25px 0;
            padding: 15px 25px;
            background-color: #1e1e1e;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            min-width: 280px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
            margin-top: 20px;
        }

        button {
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #262626;
            border: 1px solid #444;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background-color: #333333;
            border-color: #00e676;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-connect {
            border-color: #29b6f6;
        }

        .btn-voice {
            border-color: #00e676;
        }
    </style>
</head>
<body>

    <h2>AI 음성 제어 스마트카</h2>
    
    <div id="status">상태: 블루투스 연결 필요</div>

    <div class="btn-container">
        <button class="btn-connect" onclick="connectBLE()">1. 블루투스(HM-10) 연결</button>
        <button class="btn-voice" onclick="startVoice()">2. 연속 음성 인식 시작</button>
    </div>

    <script>
        let bleDevice;
        let gattServer;
        let rxCharacteristic;
        let recognition;

        // HM-10 BLE 연결
        async function connectBLE() {
            try {
                document.getElementById('status').innerText = "상태: 기기 검색 중...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
                });

                gattServer = await bleDevice.gatt.connect();
                const service = await gattServer.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                rxCharacteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');

                document.getElementById('status').innerText = "상태: 블루투스 연결 성공!";
                document.getElementById('status').style.color = "#00e676";
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "상태: 연결 실패";
                document.getElementById('status').style.color = "#ff5252";
            }
        }

        // 명령어 전송 (\n 포함)
        async function sendCommand(cmd) {
            if (!rxCharacteristic) {
                alert("블루투스가 연결되지 않았습니다.");
                return;
            }
            try {
                let encoder = new TextEncoder();
                await rxCharacteristic.writeValue(encoder.encode(cmd + "\n"));
                console.log("전송 명령:", cmd);
            } catch (error) {
                console.error("전송 오류:", error);
            }
        }

        // 음성 인식 시작 (Chrome 권장)
        function startVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용하세요.");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const speechResult = event.results[event.results.length - 1][0].transcript.trim();
                document.getElementById('status').innerText = "인식된 음성: " + speechResult;

                if (speechResult.includes("전진") || speechResult.includes("앞으로")) sendCommand("FORWARD");
                else if (speechResult.includes("후진") || speechResult.includes("뒤로")) sendCommand("BACK");
                else if (speechResult.includes("좌회전") || speechResult.includes("왼쪽")) sendCommand("LEFT");
                else if (speechResult.includes("우회전") || speechResult.includes("오른쪽")) sendCommand("RIGHT");
                else if (speechResult.includes("정지") || speechResult.includes("멈춰") || speechResult.includes("스톱")) sendCommand("STOP");
            };

            recognition.onerror = function(event) {
                console.error("음성 인식 에러:", event.error);
            };

            recognition.start();
            document.getElementById('status').innerText = "상태: 음성 인식 시작됨 (말씀하세요)";
            document.getElementById('status').style.color = "#29b6f6";
        }
    </script>
</body>
</html>
