<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360 서보 스마트카 초고속 제어</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a; color: #f8fafc;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    .container {
      width: 100%; max-width: 500px; background: #1e293b;
      border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px;
    }
    h1 { font-size: 1.4rem; text-align: center; color: #38bdf8; }
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #0f172a; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155;
    }
    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background-color: #ef4444; margin-right: 6px; }
    .status-dot.connected { background-color: #22c55e; }
    button {
      padding: 14px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%;
    }
    .btn-ble { background-color: #0284c7; color: white; }
    .btn-mic { background-color: #16a34a; color: white; }
    .btn-mic.listening { background-color: #ef4444; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    .log-box {
      height: 260px; background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 0.88rem;
    }
    .msg { padding: 8px 12px; border-radius: 6px; }
    .msg.sys { background: #334155; color: #94a3b8; }
    .msg.user { background: #0369a1; color: #ffffff; align-self: flex-end; }
    .msg.ble { background: #854d0e; color: #fef08a; }
    .msg.err { background: #991b1b; color: #fca5a5; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚗 360 서보 초고속 음성 조종기</h1>

    <div class="status-bar">
      <span>HM-10 BLE:</span>
      <span><span id="bleDot" class="status-dot"></span><span id="bleText">미연결</span></span>
    </div>

    <button class="btn-ble" onclick="connectBLE()">1. 블루투스 연결 (HM-10)</button>
    <button id="micBtn" class="btn-mic" onclick="toggleSpeech()">2. 연속 음성 인식 ON/OFF</button>

    <div id="logBox" class="log-box">
      <div class="msg sys">블루투스를 연결한 후 음성 인식을 켜세요.</div>
    </div>
  </div>

  <script>
    const BLE_SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
    const BLE_CHARACTERISTIC_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";

    let bleDevice = null;
    let bleCharacteristic = null;
    let recognition = null;
    let keepListening = false;

    async function connectBLE() {
      try {
        logMsg('sys', 'HM-10 검색 중...');
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'HM' }, { namePrefix: 'BT' }, { namePrefix: 'Smart' }],
          optionalServices: [BLE_SERVICE_UUID]
        });
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(BLE_SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(BLE_CHARACTERISTIC_UUID);

        document.getElementById('bleDot').classList.add('connected');
        document.getElementById('bleText').textContent = '연결됨';
        logMsg('sys', '✅ HM-10 연결 완료!');
      } catch (error) {
        logMsg('err', '❌ 연결 실패: ' + error.message);
      }
    }

    function onDisconnected() {
      document.getElementById('bleDot').classList.remove('connected');
      document.getElementById('bleText').textContent = '미연결';
      bleCharacteristic = null;
    }

    async function sendBLECommand(command) {
      if (!bleCharacteristic) {
        logMsg('sys', `[시뮬레이션] 송신: ${command}`);
        return;
      }
      try {
        const encoder = new TextEncoder();
        await bleCharacteristic.writeValue(encoder.encode(command + "\n"));
        logMsg('ble', `📡 HM-10 송신: [ ${command} ]`);
      } catch (error) {
        logMsg('err', 'BLE 송신 에러: ' + error.message);
      }
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;

      const rec = new SpeechRecognition();
      rec.lang = 'ko-KR';
      rec.continuous = true;
      rec.interimResults = false;

      rec.onstart = () => {
        document.getElementById('micBtn').textContent = '🎙️ 음성 듣는 중... (클릭 시 끎)';
        document.getElementById('micBtn').classList.add('listening');
      };

      rec.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const text = event.results[lastIndex][0].transcript.trim();
        logMsg('user', `🗣️ "${text}"`);
        
        // 서버 요청 없이 브라우저에서 0.1초 즉시 판단
        fastLocalParse(text);
      };

      rec.onend = () => {
        if (keepListening) { try { rec.start(); } catch(e){} }
        else { stopSpeechUI(); }
      };

      return rec;
    }

    function fastLocalParse(text) {
      if (text.includes("앞") || text.includes("전진") || text.includes("출발") || text.includes("가자")) {
        sendBLECommand("FORWARD");
      } else if (text.includes("뒤") || text.includes("후진") || text.includes("빠져")) {
        sendBLECommand("BACK");
      } else if (text.includes("왼") || text.includes("좌")) {
        sendBLECommand("LEFT");
      } else if (text.includes("오른") || text.includes("우")) {
        sendBLECommand("RIGHT");
      } else if (text.includes("멈") || text.includes("정지") || text.includes("서")) {
        sendBLECommand("STOP");
      }
    }

    function toggleSpeech() {
      if (!recognition) recognition = initSpeechRecognition();
      if (!recognition) return;

      if (keepListening) {
        keepListening = false;
        recognition.stop();
        stopSpeechUI();
      } else {
        keepListening = true;
        try { recognition.start(); } catch (e) {}
      }
    }

    function stopSpeechUI() {
      const btn = document.getElementById('micBtn');
      btn.textContent = '2. 연속 음성 인식 ON/OFF';
      btn.classList.remove('listening');
    }

    function logMsg(type, text) {
      const logBox = document.getElementById('logBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${type}`;
      msgDiv.textContent = text;
      logBox.appendChild(msgDiv);
      logBox.scrollTop = logBox.scrollHeight;
    }
  </script>
</body>
</html>
