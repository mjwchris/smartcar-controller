<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 음성 제어 스마트카</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; }
        button { padding: 15px 25px; font-size: 18px; margin: 10px; cursor: pointer; border-radius: 8px; }
        #status { font-weight: bold; color: blue; margin: 15px; }
        .control-btn { background-color: #e7e7e7; border: 1px solid #ccc; }
        .stop-btn { background-color: #ff4d4d; color: white; border: none; }
    </style>
</head>
<body>

    <h2>HM-10 스마트카 웹 조종기</h2>
    <div id="status">상태: 연결 안 됨</div>

    <button onclick="connectBLE()">1. 블루투스(HM-10) 연결</button>
    <button onclick="startVoice()">2. 음성 인식 시작</button>

    <hr>

    <h3>수동 조종 버튼</h3>
    <div>
        <button class="control-btn" onclick="sendCommand('FORWARD')">전진</button><br>
        <button class="control-btn" onclick="sendCommand('LEFT')">좌회전</button>
        <button class="stop-btn" onclick="sendCommand('STOP')">정지</button>
        <button class="control-btn" onclick="sendCommand('RIGHT')">우회전</button><br>
        <button class="control-btn" onclick="sendCommand('BACK')">후진</button>
    </div>

    <script>
        let bleDevice;
        let gattServer;
        let rxCharacteristic;
        let recognition;

        // HM-10 BLE 연결 (서비스 및 특성 UUID)
        async function connectBLE() {
            try {
                document.getElementById('status').innerText = "상태: 기기 검색 중...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
                });

                gattServer = await bleDevice.gatt.connect();
                const service = await gattServer.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                rxCharacteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');

                document.getElementById('status').innerText = "상태: 블루투스 연결 성공!";
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "상태: 연결 실패 - " + error;
            }
        }

        // 명령어 전송 함수 (명령어 뒤에 반드시 \n 추가)
        async function sendCommand(cmd) {
            if (!rxCharacteristic) {
                alert("블루투스가 연결되지 않았습니다.");
                return;
            }
            try {
                // 아두이노 수신 처리를 위해 \n 개행문자 필수 전송
                let encoder = new TextEncoder();
                await rxCharacteristic.writeValue(encoder.encode(cmd + "\n"));
                console.log("전송 명령:", cmd);
            } catch (error) {
                console.error("전송 오류:", error);
            }
        }

        // 음성 인식 처리 (Chrome 권장)
        function startVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용하세요.");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const speechResult = event.results[event.results.length - 1][0].transcript.trim();
                document.getElementById('status').innerText = "인식된 음성: " + speechResult;

                if (speechResult.includes("전진") || speechResult.includes("앞으로")) sendCommand("FORWARD");
                else if (speechResult.includes("후진") || speechResult.includes("뒤로")) sendCommand("BACK");
                else if (speechResult.includes("좌회전") || speechResult.includes("왼쪽")) sendCommand("LEFT");
                else if (speechResult.includes("우회전") || speechResult.includes("오른쪽")) sendCommand("RIGHT");
                else if (speechResult.includes("정지") || speechResult.includes("멈춰") || speechResult.includes("스톱")) sendCommand("STOP");
            };

            recognition.onerror = function(event) {
                console.error("음성 인식 에러:", event.error);
            };

            recognition.start();
            document.getElementById('status').innerText = "상태: 음성 인식 시작됨 (말씀하세요)";
        }
    </script>
</body>
</html>
