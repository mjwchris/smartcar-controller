<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 스마트카 음성 제어</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a; color: #f8fafc;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    .container {
      width: 100%; max-width: 500px; background: #1e293b;
      border-radius: 16px; padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column; gap: 16px;
    }
    h1 { font-size: 1.4rem; text-align: center; color: #38bdf8; }
    
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #0f172a; padding: 12px 16px; border-radius: 8px;
      border: 1px solid #334155; font-size: 0.95rem;
    }
    .status-dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; background-color: #ef4444; margin-right: 6px;
    }
    .status-dot.connected { background-color: #22c55e; }

    button {
      padding: 14px; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: bold; cursor: pointer;
      transition: all 0.2s ease; width: 100%;
    }
    .btn-ble { background-color: #3b82f6; color: white; }
    .btn-ble:hover { background-color: #2563eb; }
    
    .btn-mic { background-color: #0284c7; color: white; }
    .btn-mic.listening { background-color: #ef4444; animation: pulse 1.5s infinite; }
    
    @keyframes pulse {
      0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; }
    }

    .log-box {
      height: 280px; background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; padding: 12px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px; font-size: 0.88rem;
    }
    .msg { padding: 8px 12px; border-radius: 6px; line-height: 1.4; }
    .msg.sys { background: #334155; color: #94a3b8; }
    .msg.user { background: #0369a1; color: #ffffff; align-self: flex-end; }
    .msg.ai { background: #15803d; color: #ffffff; align-self: flex-start; }
    .msg.ble { background: #854d0e; color: #fef08a; }
    .msg.err { background: #991b1b; color: #fca5a5; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚗 AI 스마트카 블루투스 제어</h1>

    <div class="status-bar">
      <span>HM-10 BLE:</span>
      <span><span id="bleDot" class="status-dot"></span><span id="bleText">미연결</span></span>
    </div>

    <button class="btn-ble" onclick="connectBLE()">1. 블루투스 연결 (HM-10)</button>
    <button id="micBtn" class="btn-mic" onclick="toggleSpeech()">2. 음성 명령 시작 (마이크)</button>

    <div id="logBox" class="log-box">
      <div class="msg sys">블루투스를 연결한 후 음성 명령을 시작하세요.</div>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // [설정] 본인의 Google Gemini API 키를 입력하세요.
    // ----------------------------------------------------
    const API_KEY = "YOUR_GEMINI_API_KEY"; 
    const MODEL_NAME = "gemini-3.6-flash";
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;

    // HM-10 BLE 표준 서비스 및 특성 UUID
    const BLE_SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
    const BLE_CHARACTERISTIC_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";

    let bleDevice = null;
    let bleCharacteristic = null;
    let recognition = null;
    let isListening = false;

    // 1. Web Bluetooth API (HM-10 연결)
    async function connectBLE() {
      try {
        logMsg('sys', '블루투스 장치 검색 중...');
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'HM' }, { namePrefix: 'BT' }, { namePrefix: 'Smart' }],
          optionalServices: [BLE_SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(BLE_SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(BLE_CHARACTERISTIC_UUID);

        document.getElementById('bleDot').classList.add('connected');
        document.getElementById('bleText').textContent = '연결됨';
        logMsg('sys', '✅ HM-10 블루투스 연결 완료!');
      } catch (error) {
        logMsg('err', '❌ 블루투스 연결 실패: ' + error.message);
      }
    }

    function onDisconnected() {
      document.getElementById('bleDot').classList.remove('connected');
      document.getElementById('bleText').textContent = '미연결';
      logMsg('err', '⚠️ 블루투스 연결이 끊어졌습니다.');
      bleCharacteristic = null;
    }

    // HM-10으로 데이터 전송
    async function sendBLECommand(command) {
      if (!bleCharacteristic) {
        logMsg('sys', `[시뮬레이션 모드] 전송 신호: '${command}'`);
        return;
      }
      try {
        const encoder = new TextEncoder();
        await bleCharacteristic.writeValue(encoder.encode(command + "\n"));
        logMsg('ble', `📡 HM-10 송신: [ ${command} ]`);
      } catch (error) {
        logMsg('err', 'BLE 전송 실패: ' + error.message);
      }
    }

    // 2. Web Speech API (STT)
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        logMsg('err', '❌ 이 브라우저는 Web Speech API를 지원하지 않습니다. Chrome을 사용해 주세요.');
        return null;
      }

      const rec = new SpeechRecognition();
      rec.lang = 'ko-KR';
      rec.continuous = false;

      rec.onstart = () => {
        isListening = true;
        const btn = document.getElementById('micBtn');
        btn.textContent = '🎙️ 듣고 있습니다... (말씀하세요)';
        btn.classList.add('listening');
      };

      rec.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        logMsg('user', `🗣️ 음성: "${transcript}"`);
        await parseCommandWithGemini(transcript);
      };

      rec.onerror = (e) => {
        logMsg('err', '음성 인식 에러: ' + e.error);
        stopSpeech();
      };

      rec.onend = () => stopSpeech();
      return rec;
    }

    function toggleSpeech() {
      if (!API_KEY || API_KEY === "YOUR_GEMINI_API_KEY") {
        alert("코드 안의 API_KEY 변수에 Gemini API 키를 입력해 주세요!");
        return;
      }
      if (!recognition) recognition = initSpeechRecognition();
      if (!recognition) return;

      if (isListening) recognition.stop();
      else recognition.start();
    }

    function stopSpeech() {
      isListening = false;
      const btn = document.getElementById('micBtn');
      btn.textContent = '2. 음성 명령 시작 (마이크)';
      btn.classList.remove('listening');
    }

    // 3. Gemini REST API (gemini-3.6-flash)
    async function parseCommandWithGemini(userPrompt) {
      logMsg('sys', 'Gemini AI 명령 해석 중...');

      const payload = {
        contents: [{ parts: [{ text: userPrompt }] }],
        systemInstruction: {
          parts: [{
            text: `너는 스마트카 제어 AI야. 사용자의 음성 명령을 해석해서 오직 다음 5가지 단어 중 하나만 대문자로 출력해.
            - 전진, 앞으로, 출발 -> FORWARD
            - 후진, 뒤로, 후퇴 -> BACK
            - 좌회전, 왼쪽 -> LEFT
            - 우회전, 오른쪽 -> RIGHT
            - 정지, 멈춰, 서 -> STOP
            명령을 알 수 없는 경우 STOP으로 응답해. 설명이나 추가 단어 없이 오직 한 단어만 출력해.`
          }]
        }
      };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.error) {
          logMsg('err', '❌ API 오류: ' + data.error.message);
          return;
        }

        if (!data.candidates || data.candidates.length === 0 || !data.candidates[0].content) {
          logMsg('err', '⚠️ AI가 명령을 응답하지 못했습니다.');
          sendBLECommand("STOP");
          return;
        }

        const command = data.candidates[0].content.parts[0].text.trim();
        logMsg('ai', `🤖 AI 판단: ${command}`);
        
        sendBLECommand(command);

      } catch (error) {
        logMsg('err', 'AI 해석 실패: ' + error.message);
      }
    }

    function logMsg(type, text) {
      const logBox = document.getElementById('logBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${type}`;
      msgDiv.textContent = text;
      logBox.appendChild(msgDiv);
      logBox.scrollTop = logBox.scrollHeight;
    }
  </script>
</body>
</html>
